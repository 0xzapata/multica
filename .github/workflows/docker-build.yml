name: Docker Build — Zeabur

# Unified multi-image build for the Zeabur deployment branch.
# Builds web + backend natively for amd64/arm64, dispatches the daemon
# repo to build its image with the same zeabur-<sha> tag, and then a
# tag-sync job waits for the daemon workflow check before promoting
# all three images to `latest`. Atomic: if any step fails, `latest`
# stays on the previous known-good build.

on:
  push:
    branches: [zeabur]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── meta ────────────────────────────────────────────────────────────
  # Compute the canonical zeabur-<sha> tag once and surface it to the
  # other jobs. The `sha` output uses the head commit on zeabur.
  meta:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve build tag
        id: meta
        run: |
          sha="${{ github.sha }}"
          tag="zeabur-${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Building for ${tag}"

  # ── build-web ───────────────────────────────────────────────────────
  docker-web-build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute web image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/multica-web
          labels: |
            org.opencontainers.image.title=Multica Web (Zeabur)
            org.opencontainers.image.description=Multica self-hosted web frontend — Zeabur branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=zeabur-web-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=zeabur-web-${{ env.PLATFORM_PAIR }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=zeabur-${{ needs.meta.outputs.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/multica-web,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests-web
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests-web/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-web-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests-web/*
          if-no-files-found: error
          retention-days: 1

  # ── build-backend ──────────────────────────────────────────────────
  docker-backend-build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute backend image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/multica-backend
          labels: |
            org.opencontainers.image.title=Multica Backend (Zeabur)
            org.opencontainers.image.description=Multica self-hosted backend — Zeabur branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=zeabur-backend-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=zeabur-backend-${{ env.PLATFORM_PAIR }}
          build-args: |
            VERSION=zeabur-${{ needs.meta.outputs.sha }}
            COMMIT=${{ needs.meta.outputs.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/multica-backend,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests-backend
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests-backend/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-backend-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests-backend/*
          if-no-files-found: error
          retention-days: 1

  # ── merge-web ───────────────────────────────────────────────────────
  # Combine the per-arch digests into a single manifest list and pin
  # the zeabur-<sha> tag. `latest` is set later by the tag-sync job
  # only after the daemon image has been built successfully.
  docker-web-merge:
    needs: [meta, docker-web-build]
    runs-on: ubuntu-latest
    concurrency:
      group: zeabur-docker-web-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests-web
          pattern: digests-web-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute web image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/multica-web
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.meta.outputs.tag }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests-web
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/multica-web@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/multica-web:${{ needs.meta.outputs.tag }}

  # ── merge-backend ──────────────────────────────────────────────────
  docker-backend-merge:
    needs: [meta, docker-backend-build]
    runs-on: ubuntu-latest
    concurrency:
      group: zeabur-docker-backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests-backend
          pattern: digests-backend-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute backend image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/multica-backend
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.meta.outputs.tag }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests-backend
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/multica-backend@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/multica-backend:${{ needs.meta.outputs.tag }}

  # ── trigger-daemon ─────────────────────────────────────────────────
  # Fires a repository_dispatch event into 0xzapata/multica-daemon
  # carrying the same ref+sha so the daemon image gets the matching
  # zeabur-<sha> tag. Auth uses a PAT stored in GHCR_DAEMON_TOKEN
  # because the default GITHUB_TOKEN cannot dispatch across repos.
  trigger-daemon:
    needs: [meta, docker-web-merge, docker-backend-merge]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch build to multica-daemon
        env:
          GH_TOKEN: ${{ secrets.GHCR_DAEMON_TOKEN }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/0xzapata/multica-daemon/dispatches \
            -d '{
              "event_type": "zeabur-build",
              "client_payload": {
                "ref": "zeabur",
                "sha": "${{ needs.meta.outputs.sha }}",
                "tag": "${{ needs.meta.outputs.tag }}"
              }
            }'
          echo "Dispatched zeabur-build to 0xzapata/multica-daemon"

  # ── tag-sync ───────────────────────────────────────────────────────
  # Wait for the daemon's zeabur-<sha> tag to exist in GHCR, then
  # promote all three images to `latest`. Polling GHCR for the tag
  # itself is more reliable than waiting on a check run: it correctly
  # attributes the build to *this* dispatch (a previous run's check
  # could fool action-wait-for-check into returning success), and
  # works even if the daemon's master branch is unchanged and
  # re-dispatched with a new SHA.
  tag-sync:
    needs: [meta, docker-web-merge, docker-backend-merge, trigger-daemon]
    runs-on: ubuntu-latest
    concurrency:
      group: zeabur-tag-sync-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Wait for daemon image to appear
        env:
          GH_TOKEN: ${{ secrets.GHCR_DAEMON_TOKEN }}
          SHA: ${{ needs.meta.outputs.sha }}
        run: |
          tag="zeabur-${SHA}"
          for i in $(seq 1 180); do
            if gh api "/users/0xzapata/packages/container/multica-daemon/versions" \
                --jq '.[] | select(.metadata.container.tags | index(env.tag)) | .id' \
                | grep -q .; then
              echo "Daemon image ${tag} is available"
              exit 0
            fi
            echo "[$i/180] Daemon image ${tag} not yet available, sleeping 10s"
            sleep 10
          done
          echo "::error::Timed out waiting for daemon image ${tag}"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote web to latest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/multica-web:latest \
            ghcr.io/${{ github.repository_owner }}/multica-web:${{ needs.meta.outputs.tag }}

      - name: Promote backend to latest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/multica-backend:latest \
            ghcr.io/${{ github.repository_owner }}/multica-backend:${{ needs.meta.outputs.tag }}

      - name: Promote daemon to latest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/multica-daemon:latest \
            ghcr.io/${{ github.repository_owner }}/multica-daemon:${{ needs.meta.outputs.tag }}

      - name: Inspect promoted images
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/multica-web:latest
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/multica-backend:latest
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/multica-daemon:latest
